  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

3;text-decoration:none}\np{margin:0}\n.eyebrow{font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:#B46A44}\n.btn{display:inline-flex;align-items:center;gap:.5rem;font-weight:600;border-radius:999px;padding:.8rem 1.6rem;font-size:.95rem;line-height:1;cursor:pointer;border:1.5px solid transparent;transition:background .2s ease,color .2s ease,border-color .2s ease}\n.btn-primary{background:#2F3A33;color:#F6F1E9}\n.btn-primary:hover{background:#45544A}\n.btn-ghost{background:transparent;color:#2F3A33;border-color:#C9BFA6}\n.btn-ghost:hover{border-color:#2F3A33}\n.navlink{font-size:.9rem;font-weight:500;color:#4A544C;border-bottom:1.5px solid transparent;padding-bottom:2px;transition:color .2s,border-color .2s}\n.navlink:hover{color:#2F3A33;border-color:#C77B58}\n.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;text-align:center;color:#6E7D68;background:#E8EEE6;border:1.5px dashed #AEBEA6;border-radius:4px;padding:1.5rem}\n.ph small{font-size:.8rem;color:#80907A}\nhr.rule{border:none;border-top:1px solid #E2DAC8;margin:0}\n.card{background:#FBF8F1;border:1px solid #E6DECB;border-radius:6px;padding:2.2rem;display:flex;flex-direction:column;gap:1rem}\n.chip{font-family:'DM Serif Display',Georgia,serif;font-style:italic;font-size:clamp(1.05rem,1.5vw,1.3rem);color:#F2ECDF;background:#394740;border:1px solid #4D5A51;border-radius:999px;padding:.65rem 1.3rem}\n.lede{font-size:clamp(1.05rem,1.4vw,1.2rem);line-height:1.7;color:#4A544C}\n.wrap{max-width:1180px;margin:0 auto;padding-left:clamp(20px,5vw,80px);padding-right:clamp(20px,5vw,80px)}\n.sct{padding-top:clamp(3.5rem,7vw,6.5rem);padding-bottom:clamp(3.5rem,7vw,6.5rem)}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<!-- ============ HEADER ============ -->\n<header style=\"width:100%;background:#F6F1E9;border-bottom:1px solid #E2DAC8\">\n  <div class=\"wrap\" style=\"display:flex;flex-wrap:wrap;align-items:center;gap:1rem 2rem;padding-top:1.1rem;padding-bottom:1.1rem\">\n    <a href=\"#\" style=\"display:flex;flex-direction:column;line-height:1.05;margin-right:auto\">\n      <span style=\"font-family:'DM Serif Display',Georgia,serif;font-size:1.45rem\">Valentine Verdin<\u002Fspan>\n      <span style=\"font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:#8A7E6B;font-weight:600;margin-top:.2rem\">Diététicienne · Nutritionniste<\u002Fspan>\n    <\u002Fa>\n    <nav aria-label=\"Navigation principale\" style=\"display:flex;flex-wrap:wrap;gap:1.4rem;align-items:center\">\n      <a class=\"navlink\" href=\"#digestif\">Troubles digestifs<\u002Fa>\n      <a class=\"navlink\" href=\"#femme\">Santé de la femme<\u002Fa>\n      <a class=\"navlink\" href=\"#nourriture\">Relation à la nourriture<\u002Fa>\n      <a class=\"navlink\" href=\"#methode\">Ma méthode<\u002Fa>\n      <a class=\"navlink\" href=\"#contact\">Où me trouver<\u002Fa>\n    <\u002Fnav>\n    <div style=\"display:flex;align-items:center;gap:1.2rem\">\n      <a href=\"#\" aria-label=\"Switch to English\" class=\"navlink\" style=\"font-weight:600;color:#2F3A33\">FR&nbsp;/&nbsp;EN<\u002Fa>\n      <a href=\"#rdv\" class=\"btn btn-primary\">Prendre rendez‑vous<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- ============ HERO ============ -->\n<section style=\"width:100%;background:#F6F1E9\">\n  <div class=\"wrap sct\" style=\"display:flex;flex-wrap:wrap;gap:clamp(2rem,5vw,4.5rem);align-items:center\">\n    <div style=\"flex:1 1 440px;min-width:0\">\n      <p class=\"eyebrow\" style=\"margin-bottom:1.3rem\">Formée à l'ULB · Intégrée aux équipes du CHIREC<\u002Fp>\n      <h1 style=\"margin:0;font-size:clamp(2.3rem,5vw,4rem);line-height:1.06\">Votre ventre vous gâche la vie depuis des années ?<\u002Fh1>\n      <p class=\"lede\" style=\"margin-top:1.6rem;max-width:36ch\">Ballonnements, fatigue, « côlon irritable » sans réponse ? Je vous aide à comprendre ce qui se passe — SIBO, IMO, intolérances — notamment grâce au Breath test, puis nous reconstruisons ensemble, étape par étape, une alimentation adaptée pour retrouver de l'énergie.<\u002Fp>\n      <div style=\"margin-top:2.2rem;display:flex;flex-wrap:wrap;gap:.9rem\">\n        <a href=\"#rdv\" class=\"btn btn-primary\">Prendre rendez‑vous<\u002Fa>\n        <a href=\"#methode\" class=\"btn btn-ghost\">Comment je travaille<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1 1 360px;min-width:0\">\n      <img src=\"25cd11eb-1ef8-4c70-98de-33c83962f7e3\" alt=\"Valentine Verdin, diététicienne-nutritionniste\" style=\"width:100%;aspect-ratio:4/5;object-fit:cover;object-position:center top;border-radius:24px;display:block;background:#1A1A1A\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ MOTS À IMPACT ============ -->\n<section style=\"width:100%;background:#2F3A33;color:#F2ECDF\">\n  <div class=\"wrap sct\">\n    <p class=\"eyebrow\" style=\"color:#E0A684;text-align:center;margin-bottom:2rem\">Ce que j'entends chaque semaine<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;gap:1rem 1.2rem;justify-content:center;max-width:960px;margin:0 auto\">\n      <span class=\"chip\">« Le soir, j'ai l'air enceinte. »<\u002Fspan>\n      <span class=\"chip\">« On m'a dit que c'était dans ma tête. »<\u002Fspan>\n      <span class=\"chip\">« Je traîne ça depuis des années, sans réponse. »<\u002Fspan>\n      <span class=\"chip\">« Je suis épuisée, le cerveau dans le brouillard. »<\u002Fspan>\n      <span class=\"chip\">« J'ai peur de manger. »<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"text-align:center;max-width:60ch;margin:2.4rem auto 0;font-size:1.12rem;line-height:1.75;color:#D7CFBF\">Si vous vous reconnaissez, vous êtes au bon endroit. Derrière ces phrases, il y a souvent une explication — puis un plan concret, étape par étape.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ TROIS PORTES ============ -->\n<section id=\"digestif\" style=\"width:100%;background:#F6F1E9\">\n  <div class=\"wrap sct\">\n    <div style=\"max-width:620px\">\n      <p class=\"eyebrow\" style=\"margin-bottom:1rem\">Par où commencer<\u002Fp>\n      <h2 style=\"margin:0;font-size:clamp(1.9rem,3.4vw,2.7rem)\">Trois raisons de pousser ma porte<\u002Fh2>\n      <p class=\"lede\" style=\"margin-top:1.1rem\">Selon ce qui vous amène. Et si vous hésitez, prenez simplement rendez‑vous : on fera le tri ensemble.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"margin-top:3rem;display:flex;flex-wrap:wrap;gap:1.5rem\">\n      <article class=\"card\" style=\"flex:1 1 300px;min-width:0;border-top:3px solid #C77B58\">\n        <span class=\"eyebrow\">Ma spécialité<\u002Fspan>\n        <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#C77B58\" stroke-width=\"1.5\" aria-hidden=\"true\"><path d=\"M12 3c-3 0-5 2.2-5 5 0 2 1 3.2 1 5.5A4 4 0 0 0 12 21a4 4 0 0 0 4-4c0-2.3 1-3.5 1-5.5 0-2.8-2-5-5-5z\"><\u002Fpath><path d=\"M9.5 9.5c.8.8 4.2.8 5 0\"><\u002Fpath><\u002Fsvg>\n        <h3 style=\"margin:0;font-size:1.45rem\">Troubles digestifs<\u002Fh3>\n        <p style=\"color:#4A544C;line-height:1.6\">SII, ballonnements, SIBO, IMO, H2S. Interprétation du Breath test, Low FODMAP en 3 phases, réintroduction guidée.<\u002Fp>\n        <a href=\"#methode\" class=\"navlink\" style=\"margin-top:auto;color:#B46A44;font-weight:600\">Découvrir&nbsp;→<\u002Fa>\n      <\u002Farticle>\n      <article class=\"card\" style=\"flex:1 1 300px;min-width:0;border-top:3px solid #8FA68E\">\n        <span class=\"eyebrow\" style=\"color:#5E7256\">Santé hormonale<\u002Fspan>\n        <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#8FA68E\" stroke-width=\"1.5\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"9\" r=\"5.5\"><\u002Fcircle><path d=\"M12 14.5V21M9 18h6\"><\u002Fpath><\u002Fsvg>\n        <h3 style=\"margin:0;font-size:1.45rem\">Santé de la femme<\u002Fh3>\n        <p style=\"color:#4A544C;line-height:1.6\">Endométriose, SOPK (SMOP), péri‑ménopause et ménopause. Le lien digestion‑hormones, au cœur de ma pratique au CHIREC.<\u002Fp>\n        <a href=\"#femme\" class=\"navlink\" style=\"margin-top:auto;color:#5E7256;font-weight:600\">Découvrir&nbsp;→<\u002Fa>\n      <\u002Farticle>\n      <article class=\"card\" style=\"flex:1 1 300px;min-width:0;border-top:3px solid #2F3A33\">\n        <span class=\"eyebrow\" style=\"color:#4A544C\">Mieux manger<\u002Fspan>\n        <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#2F3A33\" stroke-width=\"1.5\" aria-hidden=\"true\"><path d=\"M12 21s-6.5-4.3-6.5-9.2A3.3 3.3 0 0 1 12 9.5a3.3 3.3 0 0 1 6.5 2.3C18.5 16.7 12 21 12 21z\"><\u002Fpath><\u002Fsvg>\n        <h3 style=\"margin:0;font-size:1.45rem\">Relation à la nourriture<\u002Fh3>\n        <p style=\"color:#4A544C;line-height:1.6\">Fatigué·e de manger « sous contrôle » ? La méthode des 8 étapes pour réapprendre à manger sereinement.<\u002Fp>\n        <a href=\"#nourriture\" class=\"navlink\" style=\"margin-top:auto;color:#2F3A33;font-weight:600\">Découvrir&nbsp;→<\u002Fa>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ IMAGE ÉDITORIALE ============ -->\n<section style=\"width:100%;background:#F6F1E9\">\n  <div class=\"wrap\">\n    <div class=\"ph\" role=\"img\" aria-label=\"Emplacement photo large : vraie cuisine, aliments frais\" style=\"height:clamp(240px,34vw,460px);border-radius:6px\">\n      <svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#8FA68E\" stroke-width=\"1.5\" aria-hidden=\"true\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2\"><\u002Frect><path d=\"M3 15l5-4 4 3 4-4 5 4\"><\u002Fpath><circle cx=\"8.5\" cy=\"9\" r=\"1.5\"><\u002Fcircle><\u002Fsvg>\n      <span style=\"font-weight:600\">Photo large à venir<\u002Fspan>\n      <small>Vraie cuisine, aliments frais — pas de « photo régime »<\u002Fsmall>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ POURQUOI / DISTINCTION ============ -->\n<section style=\"width:100%;background:#F0EADB\">\n  <div class=\"wrap sct\" style=\"display:flex;flex-wrap:wrap;gap:clamp(2rem,5vw,4rem)\">\n    <div style=\"flex:1 1 320px;min-width:0\">\n      <p class=\"eyebrow\" style=\"margin-bottom:1rem\">Pourquoi moi<\u002Fp>\n      <h2 style=\"margin:0;font-size:clamp(1.9rem,3.4vw,2.7rem);line-height:1.1\">Une diététique rigoureuse, au sein d'équipes médicales<\u002Fh2>\n      <p class=\"lede\" style=\"margin-top:1.2rem\">Je ne travaille pas seule dans mon coin : je fais partie d'équipes hospitalières et je reste en lien direct avec votre médecin, du premier bilan au suivi.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex:1 1 380px;min-width:0;display:flex;flex-direction:column\">\n      <hr class=\"rule\">\n      <div style=\"padding:1.3rem 0;display:flex;gap:1rem\"><span style=\"color:#C77B58;font-weight:700\">01<\u002Fspan><p style=\"color:#39433C\"><strong style=\"font-weight:600\">Intégrée au CHIREC<\u002Fstrong> — Clinique de l'Endométriose‑Delta, Clinique de la Ménopause‑Delta, City Clinic Louise.<\u002Fp><\u002Fdiv>\n      <hr class=\"rule\">\n      <div style=\"padding:1.3rem 0;display:flex;gap:1rem\"><span style=\"color:#C77B58;font-weight:700\">02<\u002Fspan><p style=\"color:#39433C\"><strong style=\"font-weight:600\">En lien avec votre médecin<\u002Fstrong> — gastro‑entérologue, gynécologue, médecin traitant. Un courrier de suivi après chaque bilan.<\u002Fp><\u002Fdiv>\n      <hr class=\"rule\">\n      <div style=\"padding:1.3rem 0;display:flex;gap:1rem\"><span style=\"color:#C77B58;font-weight:700\">03<\u002Fspan><p style=\"color:#39433C\"><strong style=\"font-weight:600\">Aide à la compréhension du Breath test<\u002Fstrong> — SIBO (hydrogène), IMO (méthane), H2S : je vous aide à comprendre votre résultat et ce qu'il implique pour votre alimentation.<\u002Fp><\u002Fdiv>\n      <hr class=\"rule\">\n      <div style=\"padding:1.3rem 0;display:flex;gap:1rem\"><span style=\"color:#C77B58;font-weight:700\">04<\u002Fspan><p style=\"color:#39433C\"><strong style=\"font-weight:600\">Une approche globale<\u002Fstrong> — microbiote, axe intestin‑cerveau, nerf vague, sommeil, stress. Et un accompagnement en français comme en anglais.<\u002Fp><\u002Fdiv>\n      <hr class=\"rule\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ MÉTHODE 3 PHASES ============ -->\n<section id=\"methode\" style=\"width:100%;background:#F6F1E9\">\n  <div class=\"wrap sct\">\n    <div style=\"max-width:620px\">\n      <p class=\"eyebrow\" style=\"margin-bottom:1rem\">Ma méthode<\u002Fp>\n      <h2 style=\"margin:0;font-size:clamp(1.9rem,3.4vw,2.7rem)\">Un chemin clair, en trois phases<\u002Fh2>\n      <p class=\"lede\" style=\"margin-top:1.1rem\">Pas de régime à vie. On calme, on teste, puis on construit votre alimentation durable.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"margin-top:3rem;display:flex;flex-wrap:wrap;gap:1.5rem\">\n      <div style=\"flex:1 1 280px;min-width:0\">\n        <div style=\"font-family:'DM Serif Display',Georgia,serif;font-size:3rem;color:#C77B58;line-height:1\">1<\u002Fdiv>\n        <h3 style=\"margin:.6rem 0 .6rem;font-size:1.35rem\">Éviction · ±4 semaines<\u002Fh3>\n        <p style=\"color:#4A544C;line-height:1.65\">On apaise le terrain : Low FODMAP strict, soutien du microbiote et, parfois, phytothérapie ciblée — en parallèle, si besoin, du traitement prescrit par votre médecin. L'objectif : réduire les symptômes.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 280px;min-width:0\">\n        <div style=\"font-family:'DM Serif Display',Georgia,serif;font-size:3rem;color:#8FA68E;line-height:1\">2<\u002Fdiv>\n        <h3 style=\"margin:.6rem 0 .6rem;font-size:1.35rem\">Réintroduction guidée<\u002Fh3>\n        <p style=\"color:#4A544C;line-height:1.65\">Famille d'aliments par famille d'aliments, on identifie précisément ce que vous tolérez — et en quelle quantité.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 280px;min-width:0\">\n        <div style=\"font-family:'DM Serif Display',Georgia,serif;font-size:3rem;color:#2F3A33;line-height:1\">3<\u002Fdiv>\n        <h3 style=\"margin:.6rem 0 .6rem;font-size:1.35rem\">Alimentation personnalisée<\u002Fh3>\n        <p style=\"color:#4A544C;line-height:1.65\">Votre assiette durable : règle 80/20, 30 végétaux par semaine, le plaisir de manger sans régime permanent.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ SANTÉ DE LA FEMME ============ -->\n<section id=\"femme\" style=\"width:100%;background:#E8EEE6\">\n  <div class=\"wrap sct\" style=\"display:flex;flex-wrap:wrap;gap:clamp(2rem,5vw,4rem);align-items:center\">\n    <div style=\"flex:1 1 340px;min-width:0\">\n      <div class=\"ph\" role=\"img\" aria-label=\"Emplacement photo : consultation santé de la femme\" style=\"aspect-ratio:5/4;border-color:#9DB295;background:#DCE7D8;border-radius:6px\">\n        <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#6E8268\" stroke-width=\"1.5\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"5\"><\u002Fcircle><path d=\"M12 13v8M8.5 17.5h7\"><\u002Fpath><\u002Fsvg>\n        <span style=\"font-weight:600;color:#5E7256\">Photo à venir<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1 1 360px;min-width:0\">\n      <p class=\"eyebrow\" style=\"color:#5E7256;margin-bottom:1rem\">Santé de la femme<\u002Fp>\n      <h2 style=\"margin:0;font-size:clamp(1.8rem,3.2vw,2.5rem)\">Quand les hormones et la digestion se parlent<\u002Fh2>\n      <p class=\"lede\" style=\"margin-top:1.2rem\">Endométriose, SOPK (SMOP), péri‑ménopause, ménopause : les symptômes digestifs et hormonaux sont souvent liés. J'accompagne cette double dimension, en lien avec votre gynécologue — notamment au sein des Cliniques de l'Endométriose et de la Ménopause du CHIREC.<\u002Fp>\n      <a href=\"#rdv\" class=\"btn btn-ghost\" style=\"margin-top:1.8rem\">En parler en consultation<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ RELATION À LA NOURRITURE ============ -->\n<section id=\"nourriture\" style=\"width:100%;background:#F6F1E9\">\n  <div class=\"wrap sct\" style=\"display:flex;flex-wrap:wrap;gap:clamp(2rem,5vw,4rem);align-items:center\">\n    <div style=\"flex:1 1 360px;min-width:0\">\n      <p class=\"eyebrow\" style=\"margin-bottom:1rem\">Relation à la nourriture<\u002Fp>\n      <h2 style=\"margin:0;font-size:clamp(1.8rem,3.2vw,2.5rem)\">Et si manger redevenait simple ?<\u002Fh2>\n      <p class=\"lede\" style=\"margin-top:1.2rem\">Compter, contrôler, culpabiliser, recommencer. Quand l'alimentation devient une source d'angoisse, je propose la méthode des 8 étapes, développée par le diététicien comportementaliste Florian Saffer : une approche progressive et bienveillante pour renouer avec une alimentation sereine, sans perdre en rigueur.<\u002Fp>\n      <a href=\"#rdv\" class=\"btn btn-ghost\" style=\"margin-top:1.8rem\">Découvrir la méthode<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"flex:1 1 320px;min-width:0\">\n      <div class=\"ph\" role=\"img\" aria-label=\"Emplacement photo : moment de repas apaisé\" style=\"aspect-ratio:5/4;border-radius:6px\">\n        <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#8FA68E\" stroke-width=\"1.5\" aria-hidden=\"true\"><path d=\"M6 3v8a2 2 0 0 0 4 0V3M8 11v10M18 3c-1.5 0-2.5 2-2.5 5s1 4 2.5 4v9\"><\u002Fpath><\u002Fsvg>\n        <span style=\"font-weight:600\">Photo à venir<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ DÉROULÉ DU SUIVI ============ -->\n<section style=\"width:100%;background:#2F3A33;color:#F2ECDF\">\n  <div class=\"wrap sct\">\n    <div style=\"max-width:620px\">\n      <p class=\"eyebrow\" style=\"color:#E0A684;margin-bottom:1rem\">Comment ça se passe<\u002Fp>\n      <h2 style=\"margin:0;font-size:clamp(1.9rem,3.4vw,2.6rem);color:#F6F1E9\">Un suivi d'environ 3 mois<\u002Fh2>\n      <p style=\"margin-top:1.1rem;font-size:1.1rem;line-height:1.7;color:#D7CFBF\">4 à 5 consultations maximum : mon objectif est de vous rendre autonome, le plus efficacement et rapidement possible. Accompagné·e à chaque étape, jamais laissé·e seul·e.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"margin-top:2.8rem;display:flex;flex-wrap:wrap;gap:1.5rem\">\n      <div style=\"flex:1 1 220px;min-width:0;border-top:1px solid #4D5A51;padding-top:1.2rem\"><p style=\"color:#F6F1E9;font-weight:600;margin-bottom:.4rem\">Bilan initial<\u002Fp><p style=\"color:#C7BFB0;line-height:1.6;font-size:.95rem\">Histoire, symptômes, examens. On fait le point, en lien avec votre médecin.<\u002Fp><\u002Fdiv>\n      <div style=\"flex:1 1 220px;min-width:0;border-top:1px solid #4D5A51;padding-top:1.2rem\"><p style=\"color:#F6F1E9;font-weight:600;margin-bottom:.4rem\">Plan sur mesure<\u002Fp><p style=\"color:#C7BFB0;line-height:1.6;font-size:.95rem\">Menus sur 5 semaines, liste de courses, journal Monash, guides.<\u002Fp><\u002Fdiv>\n      <div style=\"flex:1 1 220px;min-width:0;border-top:1px solid #4D5A51;padding-top:1.2rem\"><p style=\"color:#F6F1E9;font-weight:600;margin-bottom:.4rem\">Réintroduction<\u002Fp><p style=\"color:#C7BFB0;line-height:1.6;font-size:.95rem\">On teste, on ajuste, on élargit votre alimentation en sécurité.<\u002Fp><\u002Fdiv>\n      <div style=\"flex:1 1 220px;min-width:0;border-top:1px solid #4D5A51;padding-top:1.2rem\"><p style=\"color:#F6F1E9;font-weight:600;margin-bottom:.4rem\">Lien médecin<\u002Fp><p style=\"color:#C7BFB0;line-height:1.6;font-size:.95rem\">Un courrier de suivi adressé à votre médecin après chaque bilan.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ RÉSULTATS ============ -->\n<section style=\"width:100%;background:#F6F1E9\">\n  <div class=\"wrap sct\">\n    <div style=\"max-width:620px\">\n      <p class=\"eyebrow\" style=\"margin-bottom:1rem\">Ce que mes patient·es observent souvent<\u002Fp>\n      <h2 style=\"margin:0;font-size:clamp(1.9rem,3.4vw,2.6rem)\">Retrouver un quotidien léger<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"margin-top:2.4rem;display:flex;flex-wrap:wrap;gap:1rem 2.5rem;max-width:900px\">\n      <p style=\"flex:1 1 240px;border-top:2px solid #C77B58;padding-top:.9rem;font-size:1.1rem\">Un transit qui se régule<\u002Fp>\n      <p style=\"flex:1 1 240px;border-top:2px solid #8FA68E;padding-top:.9rem;font-size:1.1rem\">Des ballonnements nettement apaisés<\u002Fp>\n      <p style=\"flex:1 1 240px;border-top:2px solid #C77B58;padding-top:.9rem;font-size:1.1rem\">Le brouillard mental qui se lève<\u002Fp>\n      <p style=\"flex:1 1 240px;border-top:2px solid #8FA68E;padding-top:.9rem;font-size:1.1rem\">L'énergie qui revient<\u002Fp>\n      <p style=\"flex:1 1 240px;border-top:2px solid #C77B58;padding-top:.9rem;font-size:1.1rem\">Une liste claire des aliments tolérés<\u002Fp>\n      <p style=\"flex:1 1 240px;border-top:2px solid #8FA68E;padding-top:.9rem;font-size:1.1rem\">Une relation apaisée à l'assiette<\u002Fp>\n    <\u002Fdiv>\n    <p style=\"margin-top:2rem;font-size:.85rem;color:#80766A;max-width:60ch\">Chaque parcours est individuel ; ces évolutions sont fréquentes mais aucun résultat n'est garanti.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ TÉMOIGNAGES ============ -->\n<section style=\"width:100%;background:#F0EADB\">\n  <div class=\"wrap sct\">\n    <div style=\"text-align:center;max-width:620px;margin:0 auto\">\n      <p class=\"eyebrow\" style=\"margin-bottom:1rem\">Elles &amp; ils en parlent<\u002Fp>\n      <h2 style=\"margin:0;font-size:clamp(1.9rem,3.4vw,2.6rem)\">Des patient·es qui recommandent<\u002Fh2>\n      <div style=\"margin-top:1.2rem;display:inline-flex;align-items:center;gap:.6rem;background:#FBF8F1;border:1px solid #E6DECB;border-radius:999px;padding:.5rem 1.1rem\">\n        <span aria-hidden=\"true\" style=\"color:#E0A15C;font-size:1.1rem;letter-spacing:2px\">★★★★★<\u002Fspan
